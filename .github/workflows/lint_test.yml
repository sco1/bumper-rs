name: lint-and-test

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # .rustfmt.toml uses unstable options (group_imports, imports_granularity)
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --check

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Run clippy
        run: cargo +stable clippy --all-targets --locked

  msrv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Cargo.toml's rust-version is the single source of truth for the MSRV
      - name: Read rust-version from Cargo.toml
        id: read
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error file=Cargo.toml::rust-version is missing or invalid (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: msrv
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        toolchain: [stable, "${{ needs.msrv.outputs.version }}"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install ${{ matrix.toolchain }} toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --locked

  cog-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Check generated README content
        env:
          RUSTUP_TOOLCHAIN: stable
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install cogapp
          cog -rc README.md
          git diff --check
          git diff --exit-code -- README.md
